<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ReStyle</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

<div class="login-page">

    <a href="Welcome Page.html" class="back-home">← Back to Home</a>

    <div class="login-card">

        <div class="brand">
            <svg class="hanger" viewBox="0 0 120 80">
                <path d="M60 20 C60 8 78 8 78 22 C78 33 60 33 60 45" />
                <path d="M60 45 L18 70" />
                <path d="M60 45 L102 70" />
                <path d="M18 70 L102 70" />
                <text x="60" y="24" text-anchor="middle">♥</text>
            </svg>

            <h2>ReStyle</h2>
            <p>Redefine your style. Your way.</p>
        </div>

        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to continue to your account</p>

        <form id="loginForm" novalidate>

            <div class="input-group">
                <input type="email" id="email" placeholder="Email">
                <p id="emailError" class="error-message"></p>
            </div>

            <div class="input-group">
                <input type="password" id="password" placeholder="Password">
                <p id="passwordError" class="error-message"></p>
            </div>

            <div class="options">
                <label>
                    <input type="checkbox">
                    Remember Me
                </label>

                <a href="forgot-password.html">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">Login</button>

            <div class="divider">
                <span>OR</span>
            </div>

            <button type="button" class="google-btn">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" alt="Google">
                Continue with Google
            </button>

        </form>

        <div class="register-link">
            Don’t have an account?
            <a href="register.html">Register</a>
        </div>

    </div>

</div>

<script src="login.js"></script>
</body>
</html>
