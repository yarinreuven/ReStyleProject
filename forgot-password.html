<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - ReStyle</title>
    <link rel="stylesheet" href="forgot-password.css">
</head>

<body>

<div class="forgot-page">

    <a href="login.html" class="back-home">← Back to Login</a>

    <div class="forgot-card">

        <div class="brand">
            <svg class="hanger" viewBox="0 0 120 80">
                <path d="M60 20 C60 8 78 8 78 22 C78 33 60 33 60 45" />
                <path d="M60 45 L18 70" />
                <path d="M60 45 L102 70" />
                <path d="M18 70 L102 70" />
                <text x="60" y="24" text-anchor="middle">♥</text>
            </svg>

            <h2>ReStyle</h2>
            <p>Redefine your style. Your way.</p>
        </div>

        <h1>Forgot Password?</h1>

        <p class="subtitle">
            Enter your email and we'll send you a password reset link.
        </p>

        <form id="forgotForm" novalidate>

            <input type="email" id="email" placeholder="Email Address">
            <p id="emailError" class="error-message"></p>

            <button type="submit" class="reset-btn">
                Send Reset Link
            </button>

        </form>

        <div class="login-link">
            Remember your password?
            <a href="login.html">Login</a>
        </div>

    </div>

</div>

<script>
const forgotForm = document.getElementById("forgotForm");

forgotForm.addEventListener("submit", function(event){

    event.preventDefault();

    const email =
    document.getElementById("email");

    const emailError =
    document.getElementById("emailError");

    emailError.textContent = "";
    email.classList.remove("input-error");

    if(email.value.trim() === ""){

        emailError.textContent =
        "Email is required";

        email.classList.add("input-error");

        return;
    }

    if(!email.value.includes("@")){

        emailError.textContent =
        "Invalid email format";

        email.classList.add("input-error");

        return;
    }

    alert("Reset link sent successfully!");
});
</script>

</body>
</html>
